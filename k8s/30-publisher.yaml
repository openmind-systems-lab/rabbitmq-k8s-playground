apiVersion: v1
kind: Service
metadata:
  name: publisher
  namespace: rabbitmq-playground
spec:
  selector:
    app: publisher
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: publisher
  namespace: rabbitmq-playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app: publisher
  template:
    metadata:
      labels:
        app: publisher
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: publisher
          image: ghcr.io/openmind-systems-lab/rabbitmq-k8s-playground/publisher:local
          env:
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: password
            - name: PUBLISH_EXCHANGE_TOPIC
              value: orders.topic
            - name: PUBLISH_EXCHANGE_FANOUT
              value: orders.fanout
            - name: PUBLISH_INTERVAL_MS
              value: "2000"
            - name: PUBLISH_BURST
              value: "10"
            - name: POISON_EVERY
              value: "15"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
