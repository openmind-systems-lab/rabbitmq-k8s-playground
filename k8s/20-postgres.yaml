apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: rabbitmq-playground
type: Opaque
stringData:
  POSTGRES_DB: orders
  POSTGRES_USER: orders
  POSTGRES_PASSWORD: orders-demo-change-me
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: rabbitmq-playground
data:
  init.sql: |
    CREATE TABLE processed_orders(
      order_nb     text PRIMARY KEY,
      routing_key  text NOT NULL,
      worker       text NOT NULL,
      processed_at timestamptz NOT NULL DEFAULT now()
    );
    CREATE TABLE fanout_events(
      id          bigserial PRIMARY KEY,
      mode        text NOT NULL,
      order_nb    text NOT NULL,
      poison      boolean NOT NULL DEFAULT false,
      received_at timestamptz NOT NULL DEFAULT now(),
      UNIQUE(mode, order_nb)
    );
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: rabbitmq-playground
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: rabbitmq-playground
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:17-alpine
          envFrom:
            - secretRef:
                name: postgres-credentials
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
